<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Lab — client-side styling limits</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>QR&nbsp;<em>Lab</em></h1>
      <p>Every parameter that can be pushed client-side, with nothing but HTML, CSS and JS. Encoder written from scratch — no library, no build step, no network.</p>
    </div>
    <div class="topmeta">
      <div>Encoder <b>v1&ndash;40</b></div>
      <div>Deps <b>0</b></div>
      <div>Params <b id="paramcount">&mdash;</b></div>
    </div>
  </header>

  <div class="lab">
    <div class="stagecol">
      <div class="presets" id="presets"></div>

      <div class="stage">
        <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>
        <div id="mount"></div>
      </div>

      <div class="readout">
        <div class="rcell"><span>Version</span><b id="ro-ver">&mdash;</b></div>
        <div class="rcell"><span>Grid</span><b id="ro-size">&mdash;</b></div>
        <div class="rcell"><span>Mask</span><b id="ro-mask">&mdash;</b></div>
        <div class="rcell"><span>Bytes</span><b id="ro-bytes">&mdash;</b></div>
        <div class="rcell"><span>Modules</span><b id="ro-mods">&mdash;</b></div>
        <div class="rcell"><span>Export</span><b id="ro-px">&mdash;</b></div>
      </div>

      <div class="diag">
        <div id="verdict"></div>
        <ul class="notes" id="notes"></ul>
      </div>

      <div class="exportbar">
        <button class="btn primary" id="dl-png">Download PNG</button>
        <select id="pngscale" aria-label="PNG scale">
          <option value="1">1&times;</option>
          <option value="2" selected>2&times;</option>
          <option value="4">4&times;</option>
          <option value="8">8&times;</option>
        </select>
        <button class="btn" id="dl-svg">Download SVG</button>
        <button class="btn" id="cp-svg">Copy SVG</button>
        <button class="btn" id="randomize">Randomize</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </div>

    <div class="rack" id="rack"></div>
  </div>
</div>

<script src="js/encoder.js"></script>
<script src="js/shapes.js"></script>
<script src="js/state.js"></script>
<script src="js/schema.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
