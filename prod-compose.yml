services:
  release:
    build:
      context: .
      target: builder
    volumes:
      - ./bin:/out
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /qcode /out/qcode
        printf "\033[1;32m\n"
        printf "  ╔══════════════════════════════════╗\n"
        printf "  ║         QCODE PROD BUILD         ║\n"
        printf "  ║  Built: %-25s║\n" "$(/out/qcode --version | sed 's/qcode built: //')"
        printf "  ╚══════════════════════════════════╝\n"
        printf "\033[0m\n"


# docker compose -f prod-compose.yml build --no-cache && docker compose -f prod-compose.yml up